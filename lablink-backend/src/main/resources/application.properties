spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/lablink}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
server.port=${PORT:8080}
lablink.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
spring.jpa.open-in-view=false
spring.servlet.multipart.max-request-size=1MB
server.max-http-request-header-size=16KB
lablink.gateway-key=${GATEWAY_SHARED_SECRET:}
lablink.network-url=${NETWORK_SERVICE_URL:http://localhost:3001}
