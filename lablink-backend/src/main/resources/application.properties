spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/lablink}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
server.port=${PORT:8080}
lablink.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
lablink.firebase-project-id=${FIREBASE_PROJECT_ID:}
lablink.tcp-host=${TCP_HOST:127.0.0.1}
lablink.tcp-port=${TCP_PORT:9001}
lablink.gateway-key=${GATEWAY_SHARED_SECRET:}
lablink.network-url=${NETWORK_SERVICE_URL:http://localhost:3001}
