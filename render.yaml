services:
  - type: web
    name: lablink-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: lablink-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GATEWAY_SHARED_SECRET
        generateValue: true
      - key: NETWORK_SERVICE_URL
        sync: false

  - type: web
    name: lablink-network-service
    runtime: node
    region: singapore
    plan: free
    rootDir: lablink-network-service
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_BASE_URL
        sync: false
      - key: GATEWAY_SHARED_SECRET
        fromService:
          name: lablink-api
          type: web
          envVarKey: GATEWAY_SHARED_SECRET
      - key: CORS_ALLOWED_ORIGINS
        sync: false
